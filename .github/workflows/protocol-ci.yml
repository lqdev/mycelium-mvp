name: Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Lexicons
        run: npm run lexicon:check

      - name: Typecheck Protocol 0.1
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build dry run
        run: npm run build
